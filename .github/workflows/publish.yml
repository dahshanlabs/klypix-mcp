name: Publish to npm

# Publish klypix-mcp to npm via OIDC Trusted Publishing — NO token, NO secret.
# npm trusts this exact workflow (configured at npmjs.com → package → Settings →
# Trusted Publisher: dahshanlabs/klypix-mcp · publish.yml). Fires on a published
# GitHub Release; workflow_dispatch allows manual re-runs.
#
# Verified requirements (official npm docs, OIDC trusted publishing GA 2025-07-31):
#   - npm CLI >= 11.5.1   (asserted below from the pinned Node 24 toolchain)
#   - Node.js >= 22.14.0  (node 24 ships npm 11.x and is well above the floor)
#   - permissions id-token:write (mints the OIDC token) + contents:read
#   - GitHub-hosted runner (self-hosted not supported)
#   - Trusted Publisher configured on npm BEFORE the first run
#
# HARDENED 2026-07-30 — this workflow used to publish WITHOUT running anything.
# It now FAILS CLOSED behind a `gate` job that must go green first. `publish`
# declares `needs: gate`, so a red gate means npm never sees a tarball.
# What the gate proves is documented in docs/RELEASE_CHECKLIST.md.
#
# TRIGGER SAFETY: `release: published` + `workflow_dispatch` only. There is NO
# pull_request / pull_request_target trigger and there must never be one — a fork
# PR must not be able to reach a job that can mint an npm OIDC token. Both jobs
# additionally assert the event name at runtime, so adding a trigger without
# reading this comment fails instead of publishing.
#
# PERMISSION SPLIT: the token-minting grant (`id-token: write`) lives ONLY on the
# `publish` job. The gate runs the full test suite and installs the tarball — i.e.
# it executes third-party code — and is deliberately given `contents: read` only,
# so a compromised dependency in the test path cannot exchange an OIDC token for
# npm publish rights.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bind:
    name: Bind immutable release identity
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      evidence_commit: ${{ steps.identity.outputs.evidence_commit }}
    steps:
      # This job intentionally checks out nothing and runs no package or
      # repository code. Its output is fixed directly from GitHub's event
      # context before any dependency can mutate PATH, NODE_OPTIONS, HEAD, or
      # later step environments in the unprivileged test job.
      - name: Bind the event commit before untrusted execution
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release|workflow_dispatch) ;;
            *) echo "::error::Refusing to bind a '$EVENT_NAME' event."; exit 1 ;;
          esac
          if [ "${#EVENT_SHA}" -ne 40 ] || [[ "$EVENT_SHA" == *[!0-9a-f]* ]]; then
            echo "::error::GitHub supplied a non-canonical commit id: '$EVENT_SHA'."
            exit 1
          fi
          echo "evidence_commit=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "bound immutable event commit $EVENT_SHA"

  gate:
    name: Release gate (tests · corroborated evidence · tarball · CLI smoke)
    needs: bind
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # NO id-token here — see PERMISSION SPLIT above
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Assert the trigger is release-only
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|pull_request_target|issue_comment|fork)
              echo "::error::Refusing to run the publish pipeline from a '$EVENT_NAME' context."
              exit 1
              ;;
            release|workflow_dispatch)
              echo "trigger '$EVENT_NAME' — allowed"
              ;;
            *)
              echo "::error::Unexpected trigger '$EVENT_NAME'. Publishing is release-only; add it here deliberately or not at all."
              exit 1
              ;;
          esac

      # fetch-depth 0 + tags: the version gate below verifies that a manual
      # dispatch is standing on the tag it claims to be publishing.
      - name: Checkout (clean, full history + tags)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.bind.outputs.evidence_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the gate checkout identity
        env:
          BOUND_EVIDENCE_COMMIT: ${{ needs.bind.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$BOUND_EVIDENCE_COMMIT" ]; then
            echo "::error::Gate checkout $CHECKED_OUT_SHA differs from the pre-execution binding $BOUND_EVIDENCE_COMMIT."
            exit 1
          fi
          echo "gate checkout matches pre-execution binding $CHECKED_OUT_SHA"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Run identity and evidence verification before npm ci or any repository
      # lifecycle/test code. Later untrusted execution cannot choose the commit
      # consumed by the privileged job, which reads the bind job directly.
      - name: Version validation (the tag must match package.json)
        id: version
        env:
          BOUND_EVIDENCE_COMMIT: ${{ needs.bind.outputs.evidence_commit }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "package.json: $NAME@$VERSION"

          EXPECTED_TAG="v$VERSION"
          TAG=""
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="$EXPECTED_TAG"
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$TAG' must be exactly '$EXPECTED_TAG'."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$EXPECTED_TAG^{commit}" >/dev/null; then
            echo "::error::No tag '$EXPECTED_TAG' exists. Both release and manual triggers require the exact version tag."
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          TAGGED_SHA="$(git rev-parse "refs/tags/$EXPECTED_TAG^{commit}")"
          if [ "$CHECKED_OUT_SHA" != "$BOUND_EVIDENCE_COMMIT" ] || [ "$TAGGED_SHA" != "$BOUND_EVIDENCE_COMMIT" ]; then
            echo "::error::Tag, checkout, and pre-execution event binding must all equal $BOUND_EVIDENCE_COMMIT (checkout=$CHECKED_OUT_SHA tag=$TAGGED_SHA)."
            exit 1
          fi

          read -r -a COMMIT_LINE <<< "$(git rev-list --parents -n 1 "$CHECKED_OUT_SHA")"
          if [ "${#COMMIT_LINE[@]}" -ne 2 ]; then
            echo "::error::The tagged release must be one evidence commit with exactly one parent; found $((${#COMMIT_LINE[@]} - 1)) parent(s)."
            exit 1
          fi
          SOURCE_COMMIT="${COMMIT_LINE[1]}"
          echo "tag '$EXPECTED_TAG' points at evidence commit $CHECKED_OUT_SHA; source target is $SOURCE_COMMIT (HEAD^)"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Verify committed corroborated release evidence
        env:
          BOUND_EVIDENCE_COMMIT: ${{ needs.bind.outputs.evidence_commit }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          EVIDENCE_COMMIT="$(git rev-parse HEAD)"
          if [ "$EVIDENCE_COMMIT" != "$BOUND_EVIDENCE_COMMIT" ] || [ "$(git rev-parse HEAD^)" != "$SOURCE_COMMIT" ]; then
            echo "::error::Evidence identity changed after the pre-execution binding."
            exit 1
          fi
          BUNDLE=".release-evidence/v${VERSION}"
          node scripts/verify-release-evidence.mjs \
            --project . \
            --receipt "$BUNDLE/receipt.json" \
            --expectations "$BUNDLE/expectations.json" \
            --package "$NAME" \
            --version "$VERSION" \
            --git-commit "$SOURCE_COMMIT" \
            --require-corroborated
          echo "corroborated evidence bundle verified: $BUNDLE ($SOURCE_COMMIT -> $EVIDENCE_COMMIT)"

      # Lockfile ENFORCED. `npm ci` fails if package.json and package-lock.json
      # disagree — the whole point of gating on it rather than `npm install`.
      # Optional deps are NOT omitted here (unlike the publish job, which needs
      # no runtime deps at all): @huggingface/transformers being present is the
      # HARDER case for test/semantic-gate.mjs, which exists to prove the hook
      # never loads the embedding model from an ambient node_modules.
      - name: Install (npm ci — lockfile enforced)
        run: |
          set -euo pipefail
          npm --version
          npm ci

      # The gate is only as good as the chain it runs. Assert the slow
      # conformance suite, adversarial publication-evidence suite, CLI contract
      # suite, and the workflow's own publish classifier remain wired before
      # trusting `npm test`.
      # A `run:` block with broken shell quoting fails the gate for a reason
      # that has nothing to do with the release, and reads exactly like a real
      # red. That happened: an apostrophe inside `node -e '…'` (see the next
      # step) exited 126 on every tag. `bash -n` parses each block without
      # executing it and names the offending line instead.
      - name: Lint every run block for shell syntax errors
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/lint-run-blocks.cjs" <<'JS'
          const fs = require("fs");
          const lines = fs.readFileSync(".github/workflows/publish.yml", "utf8").replace(/\r/g, "").split("\n");
          const out = [];
          for (let i = 0; i < lines.length;) {
            const m = /^(\s*)(- )?run: \|\s*$/.exec(lines[i]);
            if (!m) { i++; continue; }
            const base = (m[1] + (m[2] || "")).length;
            const body = [];
            let j = i + 1;
            for (; j < lines.length; j++) {
              const l = lines[j];
              if (!l.trim()) { body.push(""); continue; }
              if (l.match(/^\s*/)[0].length <= base) break;
              body.push(l);
            }
            const keep = body.filter((b) => b.trim());
            const min = keep.length ? Math.min(...keep.map((b) => b.match(/^\s*/)[0].length)) : 0;
            out.push({ line: i + 1, text: body.map((b) => b.slice(min)).join("\n") });
            i = j;
          }
          fs.mkdirSync(process.argv[2], { recursive: true });
          out.forEach((b, k) => fs.writeFileSync(`${process.argv[2]}/block-${k}-line-${b.line}.sh`, `${b.text}\n`));
          console.log(`extracted ${out.length} run block(s)`);
          JS
          node "${RUNNER_TEMP}/lint-run-blocks.cjs" "${RUNNER_TEMP}/runblocks"
          rc=0
          for f in "${RUNNER_TEMP}"/runblocks/*.sh; do
            if ! err="$(bash -n "$f" 2>&1)"; then
              echo "::error::Shell syntax error in the run block starting at publish.yml $(basename "$f" | sed 's/.*line-\([0-9]*\)\.sh/line \1/'): ${err}"
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] && echo "every run block parses"
          exit "$rc"

      - name: Assert the test chain still contains the load-bearing suites
        run: |
          set -euo pipefail
          # QUOTED HEREDOC, not `node -e '...'`: inside <<'JS' the shell
          # interprets nothing, so an apostrophe in a comment cannot terminate
          # the script. It did exactly that ("workflow's" on the old comment
          # line), which made this gate exit 126 on EVERY release — the first
          # tag after it landed, v1.62.0, never reached npm. A gate that fails
          # closed on its own syntax is indistinguishable from a real red.
          cat > "${RUNNER_TEMP}/assert-test-chain.cjs" <<'JS'
          const fs = require("fs");
          const scripts = JSON.parse(fs.readFileSync("package.json", "utf8")).scripts || {};
          const script = [scripts.pretest, scripts.test].filter(Boolean).join(" && ");
          // publish-verdict.mjs guards the post-publish classifier belonging to
          // this workflow, which misreported a perfect v1.61.0 publish as a
          // broken trusted-publishing path. A release gate that stops checking
          // its own alarm logic is how that returns.
          const required = [
            "test/project-graph.mjs",
            "test/conformance.mjs",
            "test/cli-args.mjs",
            "test/evidence-publication-gate.mjs",
            "test/release-evidence-cli.mjs",
            "test/publish-workflow.mjs",
            "test/publish-verdict.mjs",
          ];
          const missing = required.filter((f) => !script.includes(f));
          if (!script.trim()) { console.error("::error::package.json has no test script — the gate would prove nothing."); process.exit(1); }
          if (missing.length) {
            console.error(`::error::The npm test chain no longer runs: ${missing.join(", ")}. Re-add them or move them to their own gate step deliberately.`);
            process.exit(1);
          }
          console.log(`npm test chain: ${script.split("&&").length} suite(s), including ${required.join(" + ")}`);
          JS
          node "${RUNNER_TEMP}/assert-test-chain.cjs"

      - name: Assert evidence wiring remains ordered and fail-closed
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/assert-evidence-wiring.cjs" <<'JS'
          const fs = require("fs");
          const lines = fs.readFileSync(".github/workflows/publish.yml", "utf8").replace(/\r/g, "").split("\n");
          const step = (name) => lines.findIndex((line) => line.trim() === `- name: ${name}`);
          const body = (start) => {
            const end = lines.findIndex((line, index) => index > start && /^\s+- name: /.test(line));
            return lines.slice(start, end < 0 ? lines.length : end).join("\n");
          };
          const version = step("Version validation (the tag must match package.json)");
          const evidence = step("Verify committed corroborated release evidence");
          const install = step("Install (npm ci — lockfile enforced)");
          const tarball = step("Tarball contents (npm pack --dry-run + assertions)");
          const bind = lines.findIndex((line) => line === "  bind:");
          const gate = lines.findIndex((line) => line === "  gate:");
          const publish = lines.findIndex((line) => line === "  publish:");
          const problems = [];
          if (!(bind >= 0 && bind < gate && gate < version && version < evidence
            && evidence < install && install < tarball && tarball < publish)) {
            problems.push("required order is bind -> gate identity/evidence -> install/tests -> tarball -> publish");
          }
          const evidenceBody = body(evidence);
          for (const token of [
            '.release-evidence/v${VERSION}',
            '--git-commit "$SOURCE_COMMIT"',
            "--require-corroborated",
            "receipt.json",
            "expectations.json",
          ]) {
            if (!evidenceBody.includes(token)) problems.push(`evidence step is missing ${token}`);
          }
          if (!body(version).includes("git rev-list --parents -n 1")) problems.push("version step no longer requires one parent");
          if (body(version).includes("npm view") || body(version).includes("already published")) {
            problems.push("gate must leave idempotent existing-version verification to the privileged integrity check");
          }
          if (!body(version).includes("BOUND_EVIDENCE_COMMIT")
            || !body(evidence).includes("BOUND_EVIDENCE_COMMIT")) {
            problems.push("version/evidence steps no longer prove the pre-execution event binding");
          }
          if (!body(tarball).includes(".release-evidence")) problems.push("tarball step no longer forbids release evidence");
          const publishBody = lines.slice(publish).join("\n");
          if (!/^    needs: \[bind, gate\]$/m.test(publishBody)) problems.push("publish job no longer needs bind and gate");
          const privilegedCheckout = step("Checkout the gate-cleared evidence commit");
          const privilegedProof = step("Prove the privileged checkout identity");
          const privilegedSetup = step("Setup pinned Node toolchain");
          const privilegedVersion = step("Confirm the version the gate cleared");
          const privilegedPublish = step("Publish (OIDC, auto-provenance)");
          if (!(publish < privilegedCheckout && privilegedCheckout < privilegedProof
            && privilegedProof < privilegedSetup && privilegedSetup < privilegedVersion
            && privilegedVersion < privilegedPublish)) {
            problems.push("privileged job order is checkout -> identity proof -> pinned toolchain -> version proof -> publish");
          }
          if (!body(privilegedCheckout).includes("needs.bind.outputs.evidence_commit")
            || !body(privilegedProof).includes("needs.bind.outputs.evidence_commit")) {
            problems.push("privileged checkout no longer consumes the pre-execution event binding directly");
          }
          if (/npm (?:ci|install|i)(?:\s|$)/m.test(publishBody)) {
            problems.push("privileged publish job must not execute dependency install code");
          }
          if (!publishBody.includes('NPM_CONFIG_IGNORE_SCRIPTS: "true"')) {
            problems.push("privileged publish job must disable repository lifecycle scripts");
          }
          if (body(privilegedSetup).includes("registry-url:")) {
            problems.push("privileged setup-node must not create token-auth registry configuration that disables OIDC discovery");
          }
          if (/uses:\s+[^\s]+@(?![a-f0-9]{40}\b)/.test(publishBody)) {
            problems.push("privileged publish-job actions must be pinned to full commit SHAs");
          }
          if (problems.length) {
            for (const problem of problems) console.error(`::error::${problem}`);
            process.exit(1);
          }
          console.log("release evidence workflow wiring: PASS");
          JS
          node "${RUNNER_TEMP}/assert-evidence-wiring.cjs"

      # Full suite. The conformance suite runs INSIDE this chain
      # (test/conformance.mjs spawns `klypix-mcp conformance --json` and asserts
      # every published check), so it is not duplicated as a separate step; the
      # step above guarantees it cannot silently leave the chain.
      - name: npm test (full suite, conformance included)
        run: npm test

      - name: Runtime dependency audit (development model stack excluded)
        run: npm audit --omit=dev --audit-level=high

      # Closes the only hole the provenance-lag warning opens: a version whose
      # attestation never appears must not stay unnoticed. The previously
      # published version is re-verified here, long after any indexing lag, and
      # a permanently unattested release fails THIS run loudly.
      - name: Re-verify the previous release's provenance (lag safety net)
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          PREV="$(npm view "$NAME" version 2>/dev/null || true)"
          if [ -z "$PREV" ]; then
            echo "no previously published version — nothing to re-verify"
            exit 0
          fi
          META="$(npm view "$NAME@$PREV" --json 2>/dev/null || true)"
          printf '%s' "$META" | node -e '
            const name = process.argv[1], version = process.argv[2];
            let s = "";
            process.stdin.on("data", d => { s += d; }).on("end", () => {
              let meta = null;
              try { meta = JSON.parse(s || "null"); } catch { /* handled below */ }
              if (!meta || meta.version !== version) {
                console.log(`::warning::could not read ${name}@${version} for provenance re-verification; skipping (not a release blocker)`);
                process.exit(0);
              }
              if (meta?.dist?.attestations?.provenance) {
                console.log(`previous release ${name}@${version} carries provenance (${meta.dist.attestations.provenance.predicateType})`);
                process.exit(0);
              }
              console.error(`::error::${name}@${version} is published WITHOUT a provenance attestation. Indexing lag has long passed, so the trusted-publishing path is broken. Fix it before publishing another version.`);
              process.exit(1);
            });
          ' "$NAME" "$PREV"

      - name: Tarball contents (npm pack --dry-run + assertions)
        env:
          PACK_JSON: ${{ runner.temp }}/pack.json
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$PACK_JSON"
          node --input-type=module -e '
            import fs from "fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const pack = JSON.parse(fs.readFileSync(process.env.PACK_JSON, "utf8"));
            const entry = Array.isArray(pack) ? pack[0] : pack;
            const files = new Set((entry.files || []).map((f) => f.path.replace(/\\\\/g, "/")));
            const problems = [];
            const need = (p, why) => {
              const rel = String(p).replace(/^\.\//, "");
              if (!files.has(rel)) problems.push(`MISSING    ${rel}   — ${why}`);
            };

            // 1. Every published command must BE in the tarball, or `npm i -g`
            //    creates a shim pointing at nothing.
            for (const [name, rel] of Object.entries(pkg.bin || {})) need(rel, `package.json bin.${name}`);

            // 2. Every import surface.
            if (pkg.main) need(pkg.main, "package.json main");
            for (const [key, value] of Object.entries(pkg.exports || {})) {
              if (typeof value === "string") need(value, `package.json exports["${key}"]`);
            }

            // 3. Everything package.json PROMISES to ship: literal files must be
            //    present (catches an .npmignore slip), declared directories must
            //    be non-empty (catches a silently emptied directory).
            for (const declared of pkg.files || []) {
              const rel = String(declared).replace(/^\.\//, "").replace(/\/$/, "");
              if (fs.existsSync(rel) && fs.statSync(rel).isDirectory()) {
                if (![...files].some((f) => f.startsWith(`${rel}/`))) {
                  problems.push(`EMPTY      ${rel}/   — declared in package.json "files" but no entry shipped`);
                }
              } else {
                need(rel, "declared in package.json \"files\"");
              }
            }
            for (const doc of ["README.md", "LICENSE", "NOTICE"]) need(doc, "documentation / licensing must ship");

            // 4. THE REGRESSION GATE. The README tells users to open example
            //    canvases at a literal node_modules/klypix-mcp/examples/... path.
            //    Those files were EXCLUDED from the tarball until 2026-07-30, so
            //    the documented command failed on a fresh install. Every example
            //    path the README names must resolve inside the tarball.
            const readme = fs.readFileSync("README.md", "utf8");
            const exampleRefs = new Set();
            for (const m of readme.matchAll(/(?:\]\(|node_modules\/klypix-mcp\/|["\x27`\s])(examples\/[A-Za-z0-9._\/-]+\.[A-Za-z0-9]+)/g)) exampleRefs.add(m[1]);
            if (exampleRefs.size === 0) {
              problems.push("VACUOUS    README.md references no examples/ path, so this assertion now checks nothing. Restore the references or remove this gate deliberately.");
            }
            for (const ref of exampleRefs) need(ref, "README.md tells users to open this exact path inside node_modules/klypix-mcp");

            // 5. Things that must never be published.
            for (const f of [...files].filter((p) => /^node_modules\//.test(p)
              || /^\.git\//.test(p)
              || /^\.release-evidence(?:\/|$)/.test(p)
              || /(^|\/)\.env($|\.)/.test(p)
              || /\.klypix-bak$/.test(p)
              || /(^|\/)\.impeccable\//.test(p))) {
              problems.push(`FORBIDDEN  ${f}   — must never be published`);
            }

            console.log(`tarball: ${entry.name}@${entry.version} — ${files.size} entries, ${entry.size} B packed / ${entry.unpackedSize} B unpacked`);
            console.log(`README example paths asserted: ${[...exampleRefs].join(", ") || "(none)"}`);
            if (problems.length) {
              console.error(`::error::Tarball contents gate failed with ${problems.length} problem(s)`);
              for (const p of problems) console.error(`  ${p}`);
              process.exit(1);
            }
            console.log("\ntarball contents gate: PASS");
          '

      # Everything above tests the WORKING TREE. This step tests what a user
      # actually receives: pack it, install that tarball into a throwaway
      # directory, and drive the installed binaries.
      - name: CLI smoke test (install the packed tarball, run the bins)
        env:
          SMOKE_HOME: ${{ runner.temp }}/smoke-home
        run: |
          set -euo pipefail
          TGZ_DIR="$RUNNER_TEMP/tgz"
          SMOKE="$RUNNER_TEMP/smoke"
          FIXTURE="$RUNNER_TEMP/fixture"
          rm -rf "$TGZ_DIR" "$SMOKE" "$FIXTURE" "$SMOKE_HOME"
          mkdir -p "$TGZ_DIR" "$SMOKE" "$FIXTURE" "$SMOKE_HOME"

          TGZ_NAME="$(npm pack --silent --pack-destination "$TGZ_DIR" | tail -1)"
          TGZ="$TGZ_DIR/$TGZ_NAME"
          echo "packed: $TGZ ($(stat -c%s "$TGZ") bytes)"

          cd "$SMOKE"
          npm init -y > /dev/null
          # --ignore-scripts: never run a dependency lifecycle script in the gate.
          npm install --no-save --ignore-scripts --omit=optional "$TGZ"
          BIN="$SMOKE/node_modules/.bin"

          # A throwaway HOME so nothing here can touch a real ~/.claude.
          export HOME="$SMOKE_HOME"
          export KLYPIX_MCP_INSTALL_DIR="$SMOKE_HOME/bundle"
          export KLYPIX_AUTO_UPDATE=0

          echo "--- 1. the binary runs and reports its verbs ---"
          HELP="$(timeout 60 "$BIN/klypix-mcp" --help)"
          echo "$HELP"
          grep -q '^Verbs:' <<< "$HELP"

          echo "--- 2. link --check exits NON-ZERO on drift and creates ZERO files ---"
          # This is the regression gate for the P0 fixed on 2026-07-30: the
          # standalone bin used to DROP --check, write all 14 managed files and
          # exit 0 — so a CI drift gate rewrote the tree and passed silently.
          cd "$FIXTURE"
          BEFORE="$(find . | LC_ALL=C sort | sha256sum)"
          set +e
          CHECK_OUT="$(timeout 60 "$BIN/klypix-link" --check 2>&1)"
          CHECK_CODE=$?
          set -e
          AFTER="$(find . | LC_ALL=C sort | sha256sum)"
          CREATED="$(find . -type f | wc -l)"
          echo "$CHECK_OUT"
          echo "exit=$CHECK_CODE  files_created=$CREATED"
          if [ "$CHECK_CODE" -eq 0 ]; then
            echo "::error::klypix-link --check exited 0 on a directory with 14 missing targets. It must exit non-zero on drift."
            exit 1
          fi
          if [ "$CREATED" -ne 0 ] || [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::klypix-link --check MODIFIED the fixture ($CREATED file(s)). --check must never write. This is the P0 regression gate."
            exit 1
          fi
          grep -q 'auditing the brain projection' <<< "$CHECK_OUT"
          if grep -q 'file(s) written/updated' <<< "$CHECK_OUT"; then
            echo "::error::klypix-link --check printed the WRITE banner."
            exit 1
          fi

          echo "--- 3. dispatcher parity: klypix-mcp link --check behaves identically ---"
          set +e
          DISP_OUT="$(timeout 60 "$BIN/klypix-mcp" link --check 2>&1)"
          DISP_CODE=$?
          set -e
          if [ "$DISP_CODE" -ne "$CHECK_CODE" ] || [ "$(find . -type f | wc -l)" -ne 0 ]; then
            echo "::error::The dispatcher form disagrees with the standalone bin (exit $DISP_CODE vs $CHECK_CODE) or wrote files."
            exit 1
          fi

          echo "--- 4. the README's documented example path resolves in the install ---"
          cd "$SMOKE"
          # Captured, not piped: `| head` under `pipefail` can fail the step on SIGPIPE.
          READ_OUT="$(timeout 60 "$BIN/klypix-read" node_modules/klypix-mcp/examples/showcase-brain.klypix)"
          printf '%s\n' "$READ_OUT" | head -3 || true
          grep -q '## Cards' <<< "$READ_OUT"

          echo "CLI smoke test: PASS"

  publish:
    name: Publish (OIDC trusted publishing)
    needs: [bind, gate]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Publishing must never execute repository lifecycle scripts while this
      # job can mint an npm OIDC token.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    permissions:
      id-token: write   # REQUIRED: lets GitHub Actions mint the OIDC token npm exchanges
      contents: read    # checkout
    steps:
      - name: Assert the trigger is release-only
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            release|workflow_dispatch) echo "trigger '$EVENT_NAME' — allowed" ;;
            *) echo "::error::Refusing to publish from a '$EVENT_NAME' context."; exit 1 ;;
          esac

      - name: Checkout the gate-cleared evidence commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.bind.outputs.evidence_commit }}
          persist-credentials: false

      # Prove the exact artifact identity before the privileged job executes any
      # package-manager or repository-controlled code.
      - name: Prove the privileged checkout identity
        env:
          GATE_EVIDENCE_COMMIT: ${{ needs.bind.outputs.evidence_commit }}
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "$CHECKED_OUT_SHA" != "$GATE_EVIDENCE_COMMIT" ]; then
            echo "::error::This checkout is $CHECKED_OUT_SHA but the gate cleared evidence commit $GATE_EVIDENCE_COMMIT."
            exit 1
          fi
          echo "privileged checkout matches gate-cleared evidence commit $CHECKED_OUT_SHA"

      - name: Setup pinned Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.1'
          package-manager-cache: false

      # MAKE-OR-BREAK: npm must be >= 11.5.1 for OIDC trusted publishing. Never
      # install a mutable npm release while this job can mint an OIDC token.
      - name: Assert npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          NPM_VERSION="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (![major, minor, patch].every(Number.isSafeInteger)
              || major < 11 || (major === 11 && minor < 5)
              || (major === 11 && minor === 5 && patch < 1)) {
              console.error(`::error::npm ${process.argv[1]} is below the 11.5.1 OIDC floor.`);
              process.exit(1);
            }
          ' "$NPM_VERSION"
          echo "npm $NPM_VERSION supports OIDC trusted publishing"

      # No dependency install or repository lifecycle script runs in this job.
      # The unprivileged gate already tested and packed this exact commit.
      - name: Confirm the version the gate cleared
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GATE_VERSION" ]; then
            echo "::error::This checkout is version $VERSION but the gate cleared $GATE_VERSION."
            exit 1
          fi
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "publishing version $VERSION from gate-cleared evidence commit $CHECKED_OUT_SHA"

      # A provenance read-back can outlive the registry's indexing window even
      # after npm publish succeeds. Make a failed job safe to re-run: an exact
      # immutable version may skip `npm publish` only when its registry tarball
      # integrity matches the tarball produced from this checkout. A mismatch is
      # a hard stop, never a reason to trust the existing version.
      - name: Inspect immutable registry version
        id: registry
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          META="$(npm view "$NAME@$GATE_VERSION" --json 2>/dev/null || true)"
          if ! printf '%s' "$META" | node -e '
            try {
              const meta = JSON.parse(require("fs").readFileSync(0, "utf8") || "null");
              process.exit(meta?.name === process.argv[1] && meta?.version === process.argv[2] ? 0 : 1);
            } catch { process.exit(1); }
          ' "$NAME" "$GATE_VERSION"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$GATE_VERSION is not published yet"
            exit 0
          fi

          REMOTE_INTEGRITY="$(printf '%s' "$META" | node -p '
            JSON.parse(require("fs").readFileSync(0, "utf8")).dist?.integrity || ""
          ')"
          LOCAL_INTEGRITY="$(npm pack --dry-run --json | node -p '
            JSON.parse(require("fs").readFileSync(0, "utf8"))[0]?.integrity || ""
          ')"
          if [ -z "$REMOTE_INTEGRITY" ] || [ -z "$LOCAL_INTEGRITY" ] || [ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
            echo "::error::$NAME@$GATE_VERSION already exists but its integrity does not match this checkout. Refusing to publish or waive the mismatch."
            exit 1
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "$NAME@$GATE_VERSION already exists with the exact gate-cleared integrity; skipping immutable republish"

      # Tokenless: do NOT set NODE_AUTH_TOKEN / NPM_TOKEN and do NOT add
      # setup-node's registry-url input here. That input writes an auth-token
      # stanza and exports a dummy NODE_AUTH_TOKEN, either of which can prevent
      # npm from selecting trusted-publishing OIDC. The public registry is npm's
      # default. Provenance is generated AUTOMATICALLY; no flag needed.
      # VERIFIED on the registry: klypix-mcp@1.43.1 carries
      # dist.attestations.provenance (predicateType slsa.dev/provenance/v1) and
      # _npmUser "GitHub Actions <npm-oidc-no-reply@github.com>". Do NOT add
      # `--provenance` — this path already produces it, and the step below fails
      # the run if a future change ever silently drops it.
      - name: Publish (OIDC, auto-provenance)
        if: steps.registry.outputs.exists != 'true'
        run: npm publish --access public

      - name: Verify the published artifact carries provenance
        env:
          GATE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          # READ BACK OVER PLAIN HTTPS, NOT `npm view` (2026-08-07). This job
          # deliberately carries no NODE_AUTH_TOKEN or setup-node auth stanza.
          # Authenticated polls previously returned nothing here and reported
          # "not indexed" until the loop exhausted; the classifier then read
          # an empty body as "absent": a
          # PERFECT publish (OIDC identity, SLSA attestation, `latest` tag) was
          # announced as "the publish did not land". v1.58.0 through v1.62.0 all
          # show red beside working publishes for this reason. The anonymous
          # registry document carries name, version, dist.attestations.provenance
          # and _npmUser — everything this gate needs, with no auth surface.
          # `|| true` on curl only swallows transport failure; the classifier
          # still decides, and the raw body is printed on a hard failure so the
          # next person is never left guessing like this.
          META=""
          LAST_BODY=""
          for attempt in {1..30}; do
            CANDIDATE="$(curl -sSL --max-time 20 "https://registry.npmjs.org/${NAME}/${GATE_VERSION}" 2>/dev/null || true)"
            LAST_BODY="$CANDIDATE"
            if printf '%s' "$CANDIDATE" | node -e '
              try {
                const meta = JSON.parse(require("fs").readFileSync(0, "utf8") || "null");
                process.exit(meta?.name === process.argv[1]
                  && meta?.version === process.argv[2]
                  && !!meta?.dist?.attestations?.provenance ? 0 : 1);
              } catch { process.exit(1); }
            ' "$NAME" "$GATE_VERSION"; then
              META="$CANDIDATE"
              break
            fi
            echo "complete registry metadata not indexed yet (attempt $attempt) — waiting"
            sleep 10
          done
          if [ -z "$META" ]; then
            # Three different outcomes were previously collapsed into one hard
            # failure, and the harmless one fires most often — so a GREEN publish
            # reported FAILURE (v1.56.0) and a real failure would look identical.
            # Alarm fatigue is itself a release-integrity defect. Separate them:
            #   (a) the version is not on the registry  -> the publish FAILED, hard stop;
            #   (b) it IS live and was published by the OIDC identity -> provenance
            #       indexing lag, warn and let the next run's gate re-verify;
            #   (c) it IS live but published by something else -> provenance was
            #       genuinely not produced, hard stop.
            LIVE="$(curl -sSL --max-time 20 "https://registry.npmjs.org/${NAME}/${GATE_VERSION}" 2>/dev/null || true)"
            VERDICT="$(printf '%s' "$LIVE" | node -e '
              try {
                const meta = JSON.parse(require("fs").readFileSync(0, "utf8") || "null");
                if (!meta || meta.name !== process.argv[1] || meta.version !== process.argv[2]) { console.log("absent"); process.exit(0); }
                // The provenance may have finished indexing between the poll
                // loop giving up and this read. That is a success, not a lag.
                if (meta?.dist?.attestations?.provenance) { console.log("indexed"); process.exit(0); }
                // _npmUser comes back in TWO shapes and this branch only ever
                // handled one: `npm view --json` renders an OIDC publish as the
                // STRING "GitHub Actions <npm-oidc-no-reply@github.com>", while
                // the object form {name,email} appears elsewhere. Reading .name
                // off the string yielded undefined, so every indexing lag was
                // classified "foreign" and hard-failed with "the trusted
                // publishing path is broken" — on v1.61.0, whose provenance was
                // in fact perfect. The lag branch this file added in 1.58.0 was
                // therefore unreachable. Normalise both shapes before matching.
                const raw = meta._npmUser;
                const who = (typeof raw === "string" ? raw : `${raw?.name || ""} ${raw?.email || ""}`).toLowerCase();
                console.log(who.includes("github actions") || who.includes("npm-oidc-no-reply") ? "lag" : "foreign");
              } catch { console.log("absent"); }
            ' "$NAME" "$GATE_VERSION")"
            case "$VERDICT" in
              indexed)
                echo "$NAME@$GATE_VERSION is live and its provenance attestation is indexed (it landed after the poll window)."
                exit 0 ;;
              absent)
                # Say WHY it looks absent. The previous version of this branch
                # printed only the verdict, so a read-back that was itself
                # broken was indistinguishable from a failed publish.
                echo "::error::$NAME@$GATE_VERSION is NOT on the registry — the publish did not land. This is a real failure."
                echo "registry read-back (first 400 chars of the last response):"
                printf '%s\n' "${LAST_BODY:-<empty>}" | head -c 400
                echo ""
                echo "cross-check by hand: curl -sSL https://registry.npmjs.org/${NAME}/${GATE_VERSION}"
                exit 1 ;;
              foreign)
                echo "::error::$NAME@$GATE_VERSION is live but was not published by the OIDC identity and carries no provenance. The trusted-publishing path is broken — investigate before the next release."
                exit 1 ;;
              *)
                echo "::warning::$NAME@$GATE_VERSION published via OIDC, but npm had not indexed its provenance after 300s. The artifact is live; the next release run re-verifies this version and fails if the attestation never appears. Manual check: curl -sSL https://registry.npmjs.org/${NAME}/${GATE_VERSION}"
                echo "- ⚠️ $NAME@$GATE_VERSION published; provenance indexing lagged past 300s (re-verified on the next release)." >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
            esac
          fi
          printf '%s' "$META" | node -e '
            let s = "";
            process.stdin.on("data", (d) => { s += d; }).on("end", () => {
              const meta = JSON.parse(s);
              const prov = meta?.dist?.attestations?.provenance;
              console.log(`published ${meta.name}@${meta.version} by ${meta._npmUser?.name || "unknown"}`);
              if (!prov) {
                console.error("::error::The published artifact has NO provenance attestation. The OIDC trusted-publishing path is broken — investigate before the next release.");
                process.exit(1);
              }
              console.log(`provenance: ${prov.predicateType}`);
            });
          '

# Smithery deploy config — lets smithery.ai run klypix-mcp as a stdio MCP server.
# Submission: https://smithery.ai/new  →  point at github.com/dahshanlabs/klypix-mcp
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - vault
    properties:
      vault:
        type: string
        title: Canvas vault folder
        description: The folder your .klypix canvases live in (e.g. your Desktop).
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['bin/klypix-mcp.mjs', '--vault', config.vault]
    })
  exampleConfig:
    vault: /home/you/canvases
